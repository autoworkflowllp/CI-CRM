            }
        }

        /* ===== TABLE RESPONSIVE ===== */
        @media (max-width: 900px) {
            .data-table-wrap {
                border-radius: var(--radius);
                margin: 0;
            }

            table.data-table {
                min-width: 720px;
                font-size: 12.5px;
            }

            table.data-table thead th {
                padding: 9px 10px;
                font-size: 10px;
            }

            table.data-table td {
                padding: 10px 10px;
            }

            .cell-primary {
                max-width: 180px;
                font-size: 12.5px;
            }

            .cell-avatar {
                width: 26px;
                height: 26px;
                font-size: 10px;
            }

            .table-toolbar {
                padding: 8px 10px;
                font-size: 11.5px;
            }

            .pagination {
                padding: 8px 10px;
                font-size: 11.5px;
            }

            .pagination .pg-btn {
                min-width: 28px;
                height: 28px;
                font-size: 11px;
            }
        }

        @media (max-width: 640px) {
            .view-scroll {
                padding: 10px;
            }

            .view-toolbar {
                padding: 8px 10px;
            }

            .view-toolbar .btn-primary span {
                display: none;
            }

            .view-toolbar .btn-primary {
                padding: 8px 12px;
            }
        }

        /* ===== KPI GRID MOBILE ===== */
        @media (max-width: 640px) {
            .kpi-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin-bottom: 14px;
            }

            .kpi {
                padding: 12px 13px;
                border-radius: var(--radius);
            }

            .kpi-value {
                font-size: 20px;
            }

            .kpi-label {
                font-size: 10.5px;
            }

            .kpi-icon {
                width: 30px;
                height: 30px;
                font-size: 12px;
            }

            .kpi-delta {
                font-size: 10.5px;
            }
        }

        @media (max-width: 380px) {
            .kpi-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== GRID LAYOUTS ===== */
        @media (max-width: 900px) {

            .grid-2,
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 901px) and (max-width: 1200px) {
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ===== FORMS MOBILE ===== */
        @media (max-width: 700px) {
            .form-section-body {
                grid-template-columns: 1fr;
                padding: 14px;
                gap: 12px;
            }

            .form-section-body .span-2,
            .form-section-body .span-full {
                grid-column: span 1;
            }

            .form-section-head {
                padding: 10px 14px;
                font-size: 11.5px;
            }

            .form-input,
            .form-select,
            .form-textarea {
                font-size: 16px;
                /* Prevents iOS zoom on focus */
                padding: 10px 12px;
            }
        }

        /* ===== MODAL MOBILE (bottom-sheet style) ===== */
        @media (max-width: 640px) {
            .modal-container {
                padding: 0;
                align-items: flex-end;
            }

            .modal {
                width: 100% !important;
                max-width: 100% !important;
                max-height: 92dvh;
                border-radius: var(--radius-xl) var(--radius-xl) 0 0;
                animation: slideUp 260ms cubic-bezier(.34, 1.56, .64, 1);
            }

            .modal::before {
                content: '';
                display: block;
                width: 36px;
                height: 4px;
                background: var(--border-strong);
                border-radius: 4px;
                margin: 8px auto 0;
            }

            .modal-head {
                padding: 12px 16px;
            }

            .modal-body {
                padding: 14px 16px;
            }

            .modal-foot {
                padding: 12px 16px;
                padding-bottom: calc(12px + env(safe-area-inset-bottom));
                flex-wrap: wrap;
            }

            .modal-foot .btn {
                flex: 1;
                min-width: 0;
            }
        }

        /* ===== DRAWER MOBILE ===== */
        @media (max-width: 640px) {

            .drawer,
            .drawer.wide {
                width: 100vw;
            }

            .drawer-head {
                padding: 12px 16px;
                padding-top: calc(12px + env(safe-area-inset-top));
            }

            .drawer-body {
                padding: 14px 16px;
            }

            .drawer-foot {
                padding-bottom: calc(14px + env(safe-area-inset-bottom));
            }
        }

        /* ===== DETAIL VIEW MOBILE ===== */
        @media (max-width: 900px) {
            .detail-layout {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .detail-hero {
                padding: 16px;
            }

            .detail-hero-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .detail-hero-title {
                font-size: 18px;
            }

            .detail-hero-actions {
                margin-left: 0;
                width: 100%;
                margin-top: 12px;
            }

            .detail-hero-actions .btn {
                flex: 1;
            }

            .detail-meta {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px 16px;
                padding-top: 14px;
            }

            .detail-meta-label {
                font-size: 10px;
            }

            .detail-meta-value {
                font-size: 12.5px;
            }
        }

        @media (max-width: 480px) {
            .detail-meta {
                grid-template-columns: 1fr;
            }

            .avatar.xl {
                width: 56px;
                height: 56px;
                font-size: 20px;
            }

            .detail-hero-title {
                font-size: 17px;
            }
        }

        /* ===== CARDS GRID MOBILE ===== */
        @media (max-width: 640px) {
            .cards-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .rec-card {
                padding: 14px;
            }

            .rec-card-actions {
                opacity: 1;
            }

            .rec-card-head .cell-avatar {
                width: 38px;
                height: 38px;
                font-size: 14px;
            }
        }

        /* ===== KANBAN MOBILE (snap scroll) ===== */
        @media (max-width: 900px) {
            .kanban {
                gap: 10px;
                scroll-snap-type: x mandatory;
                padding: 10px;
                -webkit-overflow-scrolling: touch;
            }

            .kanban-col {
                flex: 0 0 82vw;
                max-width: 320px;
                scroll-snap-align: start;
                max-height: calc(100dvh - 200px);
            }
        }

        /* ===== CALENDAR MOBILE ===== */
        @media (max-width: 900px) {
            .cal-day {
                min-height: 70px;
                padding: 4px 5px;
            }

            .cal-event {
                font-size: 10px;
                padding: 2px 4px;
            }

            .cal-day-num {
                font-size: 11px;
            }

            .cal-header {
                padding: 10px 12px;
            }

            .cal-month {
                font-size: 14px;
            }

            .cal-weekday {
                padding: 6px 4px;
                font-size: 9.5px;
            }
        }

        @media (max-width: 500px) {
            .cal-day {
                min-height: 58px;
                padding: 3px;
            }

            .cal-event {
                font-size: 9px;
                padding: 1px 3px;
                border-radius: 3px;
                margin-bottom: 2px;
            }

            .cal-day-num {
                font-size: 10px;
                margin-bottom: 2px;
            }
        }

        /* ===== LOGIN MOBILE ===== */
        @media (max-width: 480px) {
            .login-view {
                padding: 14px;
            }

            .login-card {
                padding: 24px 20px;
                border-radius: 16px;
            }

            .login-card h1 {
                font-size: 20px;
            }

            .login-card .form-input {
                font-size: 16px;
                padding: 11px 12px;
            }

            .login-card .btn-primary {
                padding: 13px;
                font-size: 14px;
            }
        }

        /* ===== TOAST MOBILE ===== */
        @media (max-width: 640px) {
            .toast-wrap {
                left: 12px;
                right: 12px;
                bottom: calc(12px + env(safe-area-inset-bottom));
            }

            .toast {
                min-width: 0;
                max-width: 100%;
                width: 100%;
            }
        }

        /* ===== BULK BAR MOBILE ===== */
        @media (max-width: 640px) {
            .bulk-bar {
                left: 10px;
                right: 10px;
                bottom: calc(10px + env(safe-area-inset-bottom));
                transform: none;
                border-radius: 14px;
                padding: 10px 12px;
                font-size: 12px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .bulk-bar .btn {
                padding: 6px 10px;
                font-size: 11px;
                min-height: 32px;
            }
        }

        /* ===== DROPDOWN MOBILE ===== */
        @media (max-width: 640px) {
            .dropdown-menu {
                min-width: 220px;
                max-width: calc(100vw - 20px);
            }

            .dropdown-menu.wide {
                min-width: 260px;
            }
        }

        /* ===== TABS SCROLL ===== */
        .view-tabs {
            overflow-x: auto;
            scrollbar-width: none;
        }

        .view-tabs::-webkit-scrollbar {
            display: none;
        }

        .view-tab {
            flex-shrink: 0;
        }

        /* ===== BETTER FOCUS RINGS ===== */
        *:focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 2px;
        }

        .form-input:focus-visible,
        .form-select:focus-visible,
        .form-textarea:focus-visible {
            outline: none;
            /* already has border+shadow */
        }

        /* ===== SMOOTH SCROLL ===== */
        .view-scroll,
        .sidebar-scroll,
        .modal-body,
        .drawer-body {
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth;
        }

        /* ===== PREVENT TEXT SELECTION ON UI CHROME ===== */
        .nav-item,
        .view-tab,
        .chip,
        .btn,
        .icon-btn,
        .kpi {
            -webkit-tap-highlight-color: transparent;
        }

        /* ===== LANDSCAPE PHONE ===== */
        @media (max-height: 500px) and (orientation: landscape) {
            .topbar {
                height: 48px;
            }

            :root {
                --topbar-h: 48px;
            }

            .sidebar-brand {
                height: 48px;
            }

            .kpi-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .modal {
                max-height: 95dvh;
            }
        }

        /* ===== DARK MODE MOBILE IMPROVEMENTS ===== */
        @media (max-width: 640px) {
            [data-theme="dark"] .modal {
                background: var(--bg-elev);
                border-top: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>


    <div id="loginView" class="login-view">
        <div class="login-card">
            <div style="display:flex;align-items:center;gap:12px;margin-bottom:24px">
                <div class="brand-logo">CI</div>
                <div>
                    <div style="font-weight:800;font-size:18px">Chaitanya Impex</div>
                    <div style="font-size:12px;color:var(--text-mute);letter-spacing:.04em">CRM SUITE</div>
                </div>
            </div>
            <h1 style="font-size:22px;font-weight:800;margin-bottom:6px">Welcome back</h1>
            <p style="color:var(--text-mute);font-size:13px;margin-bottom:20px">Sign in to access your sales pipeline.
            </p>
            <form id="loginForm">
                <div class="form-field" style="margin-bottom:14px">
                    <label class="form-label">Email</label>
                    <input class="form-input" id="loginEmail" type="email" required autocomplete="username"
                        placeholder="you@company.com">
                </div>
                <div class="form-field" style="margin-bottom:20px">
                    <label class="form-label">Password</label>
                    <input class="form-input" id="loginPassword" type="password" required
                        autocomplete="current-password" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" type="submit" style="width:100%;padding:12px;font-size:14px">Sign
                    in</button>
                <p id="loginError" style="margin-top:14px;text-align:center;font-size:12.5px;min-height:18px"></p>
            </form>
        </div>
    </div>


    <!-- ============================================================
     APP SHELL
     ============================================================ -->
   <div class="app" id="appView">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo">CI</div>
                <div class="brand-text">
                    <div class="brand-name">Chaitanya Impex</div>
                    <div class="brand-sub">CRM SUITE</div>
                </div>
            </div>

            <div class="sidebar-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search menu..." id="menuSearch" oninput="filterMenu(this.value)">
            </div>

            <nav class="sidebar-scroll" id="navRoot"></nav>

            <div class="sidebar-footer">
                <div class="user-card" onclick="toggleUserMenu(event)">
                    <div class="avatar" id="userAvatar">TG</div>
                    <div class="user-card-info">
                        <div class="user-card-name" id="userName">Tarangg Gupta</div>
                        <div class="user-card-role" id="userRole">Admin • Management</div>
                    </div>
                    <i class="fa-solid fa-ellipsis-vertical" style="color:var(--text-mute);font-size:11px"></i>
                </div>
            </div>
        </aside>

        <div class="sidebar-backdrop" id="sidebarBackdrop" onclick="toggleSidebar()"></div>

        <!-- TOPBAR -->
        <header class="topbar">
            <button class="menu-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="page-header">
                <div class="page-title" id="pageTitle">Dashboard</div>
                <div class="page-crumb" id="pageCrumb">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                    <i class="fa-solid fa-chevron-right"></i>
                    <span>Dashboard</span>
                </div>
            </div>

            <div class="topbar-search">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="globalSearch" placeholder="Search leads, deals, companies..."
                    onfocus="showSearchResults()" oninput="performGlobalSearch(this.value)">
                <span class="kbd">⌘K</span>
            </div>

            <div class="topbar-actions">
                <button class="icon-btn hide-sm" title="Quick Add" onclick="quickAddMenu(event)">
                    <i class="fa-solid fa-circle-plus"></i>
                </button>
                <button class="icon-btn hide-sm" title="Calendar" onclick="go('activities','calendar')">
                    <i class="fa-regular fa-calendar"></i>
                </button>
                <button class="icon-btn" title="Notifications" onclick="toggleNotifications(event)">
                    <i class="fa-regular fa-bell"></i>
                    <span class="badge-num">4</span>
                </button>
                <div class="divider hide-sm"></div>
                <button class="icon-btn" title="Toggle theme" onclick="toggleTheme()">
                    <i class="fa-regular fa-moon" id="themeIcon"></i>
                </button>
                <button class="icon-btn" title="Account" onclick="userMenu(event)">
                    <div class="avatar sm" id="topAvatar">TG</div>
                </button>
            </div>
        </header>

        <!-- MAIN -->
        <main class="main">
            <div id="viewArea" class="h-100 flex-col"></div>
        </main>
    </div>

    <!-- ============================================================
     MODAL / DRAWER / TOAST CONTAINERS
     ============================================================ -->
    <div id="modalLayer"></div>
    <div id="drawerLayer"></div>
    <div id="dropdownLayer"></div>
    <div class="toast-wrap" id="toastWrap"></div>


    <script src="gas-api.js"></script>
    <script src="app.js"></script>

</body>

</html>
