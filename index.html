<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033"><meta name="description" content="Chaitanya Impex CRM - SafeCare">
<title>Chaitanya Impex CRM</title><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f5f7fa;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--brand:#172033;--accent:#e87922;--accent2:#2563eb;--danger:#dc2626;--ok:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#172033,#27364f)}.login-card{width:min(430px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 25px 70px #0005}.logo-box{text-align:center;margin-bottom:18px}.logo-box img{max-width:220px;max-height:72px;object-fit:contain}.brand{font-weight:800;font-size:22px;margin-top:10px}.sub{color:var(--muted);margin-top:5px;font-size:13px}
.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px;text-transform:capitalize}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px #2563eb18}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:#eef2f6;color:#172033}.btn-danger{background:#fee2e2;color:#991b1b}.btn-full{width:100%}
.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.sidebar{background:#172033;color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.side-logo{background:#fff;border-radius:12px;padding:9px;margin:0 0 18px;text-align:center}.side-logo img{width:100%;max-height:52px;object-fit:contain}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#d6dbe4;border:0;padding:11px 12px;border-radius:9px;margin:3px 0}.nav button.active,.nav button:hover{background:#26344d;color:#fff}.side-actions{margin-top:14px;display:grid;gap:8px}
.main{min-width:0}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.user{font-size:13px;color:var(--muted)}.content{padding:22px;max-width:1500px;margin:auto}.page-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.page-title h1{font-size:24px;margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat .n{font-size:28px;font-weight:800;margin-top:7px}.stat .l{font-size:13px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:16px}.card-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-title{font-weight:800}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f8fafc;position:sticky;top:0}tr:hover td{background:#fafafa}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:700}.empty{padding:35px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:20px;z-index:20}.modal-card{background:#fff;border-radius:16px;width:min(760px,100%);max-height:90vh;overflow:auto}.modal-head{padding:17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:17px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-foot{padding:15px 17px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:10px;z-index:30;box-shadow:0 10px 30px #0003}
@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{position:fixed;left:-265px;width:245px;z-index:15;transition:.2s}.sidebar.open{left:0}.top{padding:0 14px}.content{padding:14px}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
</style></head>
<body>

<!-- LOGIN VIEW -->
<div id="loginView" class="login">
  <div class="login-card">
    <div class="logo-box"><img src="https://www.safe-care.in/designer/images/logo.png" alt="SafeCare"></div>
    <div class="brand">Chaitanya Impex CRM</div>
    <div class="sub">Lead, sales and customer management</div>
    <form id="loginForm" autocomplete="on">
      <div class="field"><label>Email</label><input id="loginEmail" type="email" required autocomplete="username"></div>
      <div class="field"><label>Password</label><input id="loginPassword" type="password" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-full" type="submit">Login</button>
      <p id="loginError" class="sub"></p>
    </form>
  </div>
</div>

<!-- APP VIEW -->
<div id="appView" class="app hidden">
  <div class="shell">
    <aside id="sidebar" class="sidebar">
      <div class="side-logo"><img src="https://www.safe-care.in/designer/images/logo.png" alt="SafeCare"></div>
      <div id="nav" class="nav"></div>
      <div class="side-actions">
        <button class="btn btn-secondary" onclick="openChangePassword()">Change Password</button>
        <button class="btn btn-secondary" onclick="logout()">Logout</button>
      </div>
    </aside>
    <main class="main">
      <header class="top">
        <button class="btn btn-secondary" onclick="toggleMenu()">☰</button>
        <div class="user" id="userInfo"></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>
</div>

<!-- MODAL -->
<div id="modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <strong id="modalTitle"></strong>
      <button class="btn btn-secondary" onclick="closeModal()">✕</button>
    </div>
    <div id="modalBody" class="modal-body"></div>
    <div class="modal-foot">
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button id="modalSave" class="btn btn-primary">Save</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="gas-api.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
}
</script>
</body>
</html>
